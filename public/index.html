<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earth-Ex</title><link rel="stylesheet" href="/styles.css"></head><body><main><section id="login" class="card"><h1>Earth-Ex</h1><p>The Earthbound's private movie library.</p><form id="loginForm"><input name="username" placeholder="Username" autocomplete="username" required><input name="password" type="password" placeholder="Password" autocomplete="current-password" required><button>Sign in</button><b id="loginError"></b></form></section><section id="app" hidden><header><div><h1>Earth-Ex</h1><span id="identity"></span></div><button id="logout" class="secondary">Sign out</button></header><section id="admin" class="card" hidden><h2>Admin controls</h2><input id="upload" type="file" accept="video/*"><button id="scan" class="secondary">Scan movie folder</button><form id="userForm"><input name="username" placeholder="New viewer username" required><input name="password" type="password" placeholder="Temporary password" required><button>Add viewer</button></form><p id="message"></p></section><section id="movies" class="grid"></section></section></main><dialog id="editDialog"><form id="editForm"><h2>Edit metadata</h2><input name="title" placeholder="Title" required><input name="year" placeholder="Year"><input name="genre" placeholder="Genre"><input name="poster" placeholder="Poster URL"><textarea name="description" placeholder="Description" rows="5"></textarea><button type="button" class="secondary" onclick="editDialog.close()">Cancel</button><button>Save metadata</button></form></dialog><dialog id="playerDialog" class="player-dialog"><h2 id="nowPlaying"></h2><video id="player" controls></video><button type="button" class="secondary" onclick="playerDialog.close();player.pause()">Close</button></dialog><script src="/app.js"></script></body></html>
